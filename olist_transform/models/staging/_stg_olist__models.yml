version: 2

models:
  - name: stg_olist_orders
    description: "Visão tratada e tipada da tabela de pedidos brutos."
    columns:
      - name: order_id
        description: "Chave primária do pedido."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Chave estrangeira do cliente."
        tests:
          - not_null
      - name: order_status
        description: "Status do pedido no e-commerce."
        tests:
          - not_null

  - name: stg_olist_customers
    description: "Visão tratada dos clientes com correção de CEPs."
    columns:
      - name: customer_id
        description: "Chave primária do registro de cliente por pedido."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "ID único do cliente no sistema."
        tests:
          - not_null

  - name: stg_olist_order_items
    description: "Itens pertencentes a cada pedido."
    columns:
      - name: order_id
        description: "Chave estrangeira do pedido."
        tests:
          - not_null
      - name: order_item_id
        description: "Sequencial do item dentro do pedido."
        tests:
          - not_null
      - name: product_id
        description: "Chave estrangeira do produto."
        tests:
          - not_null
      - name: seller_id
        description: "Chave estrangeira do vendedor."
        tests:
          - not_null